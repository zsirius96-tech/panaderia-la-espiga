<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestras tiendas — Panadería La Espiga</title>
  <meta name="description" content="Mapa con todas las tiendas de Panadería La Espiga. Pulsa un marcador para ver fotos, dirección y horario." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .map-layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; min-height: calc(100vh - 120px); }
    .store-list { background: #faf6ef; border-right: 1px solid #e5d9c3; overflow-y: auto; padding: 1rem; }
    .store-list h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
    .store-list .count { color: #8a7a5f; font-size: .9rem; margin-bottom: 1rem; }
    .store-card { background: #fff; border: 1px solid #e5d9c3; border-radius: 12px; padding: .8rem 1rem; margin-bottom: .75rem; cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .store-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(120,90,40,.15); }
    .store-card.is-active { outline: 2px solid #b07d2b; }
    .store-card h2 { font-size: 1rem; margin: 0 0 .2rem; }
    .store-card p { margin: 0; font-size: .85rem; color: #6b5f4c; }
    .badge { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: .1rem .6rem; margin-top: .4rem; }
    .badge.open { background: #e2f3e2; color: #2c7a2c; }
    .badge.soon { background: #fdf0d5; color: #9a6b1a; }
    #map { min-height: calc(100vh - 120px); z-index: 0; }
    .popup-photo { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: .5rem; }
    .popup-ph { display: flex; align-items: center; justify-content: center; height: 110px; border-radius: 8px; background: #f3e9d4; color: #9a6b1a; font-size: .85rem; margin-bottom: .5rem; }
    .leaflet-popup-content { min-width: 220px; }
    .leaflet-popup-content h3 { margin: 0 0 .2rem; font-size: 1rem; }
    .leaflet-popup-content p { margin: .25rem 0; font-size: .85rem; }
    .directions { display: inline-block; margin-top: .4rem; font-weight: 700; color: #b07d2b; }
    .back-link { display: inline-block; margin: 1rem; color: #b07d2b; font-weight: 700; }
    @media (max-width: 760px) {
      .map-layout { grid-template-columns: 1fr; }
      #map { min-height: 60vh; order: -1; }
      .store-list { border-right: 0; border-top: 1px solid #e5d9c3; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="brand" href="index.html" aria-label="Panadería La Espiga, inicio">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8 6 6 10 6 14a6 6 0 0 0 12 0c0-4-2-8-6-12zm0 18a1.5 1.5 0 0 1-1.5-1.5c0-2 1-4 1.5-5 .5 1 1.5 3 1.5 5A1.5 1.5 0 0 1 12 20z" fill="currentColor"/></svg>
        <span>La Espiga <small>panadería artesana</small></span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list" aria-label="Abrir menú">☰</button>
        <ul id="nav-list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#carta">Carta</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="encargos.html">Encargos</a></li>
          <li><a href="mapa.html" aria-current="page">Tiendas</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
      <a class="btn btn-primary header-cta" href="encargos.html">Hacer pedido</a>
    </div>
  </header>
  <div class="map-layout">
    <aside class="store-list" aria-label="Lista de tiendas">
      <h1>Nuestras tiendas</h1>
      <p class="count" id="store-count"></p>
      <div id="store-cards"></div>
    </aside>
    <div id="map" role="application" aria-label="Mapa mundial de tiendas La Espiga"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="locales.js"></script>
  <script>
    const map = L.map("map", { worldCopyJump: true }).setView([25, 5], 2);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const pin = L.divIcon({
      className: "espiga-pin",
      html: '<div style="background:#b07d2b;color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)">🍞</div>',
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      popupAnchor: [0, -16]
    });

    const markers = {};
    const cardsEl = document.getElementById("store-cards");
    document.getElementById("store-count").textContent =
      LOCALES.length === 1 ? "1 tienda" : LOCALES.length + " tiendas";

    LOCALES.forEach((s) => {
      const badge = s.estado === "abierta"
        ? '<span class="badge open">Abierta</span>'
        : '<span class="badge soon">Próxima apertura</span>';
      const photos = (s.fotos && s.fotos.length)
        ? s.fotos.map((f) => `<img class="popup-photo" src="${f}" alt="Foto de ${s.nombre}" loading="lazy" onerror="this.remove()" />`).join("")
        : `<div class="popup-ph">📷 Fotos próximamente</div>`;
      const popup = `
        ${photos}
        <h3>${s.nombre}</h3>
        <p>${s.direccion}<br />${s.ciudad}, ${s.pais}</p>
        <p>🕒 ${s.horario}</p>
        <p>📞 <a href="tel:${s.telefono.replace(/\s/g, "")}">${s.telefono}</a></p>
        <p>${s.descripcion}</p>
        <p>${badge}</p>
        <a class="directions" target="_blank" rel="noopener"
           href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}">Cómo llegar →</a>`;

      const m = L.marker([s.lat, s.lon], { icon: pin }).addTo(map).bindPopup(popup);
      markers[s.id] = m;

      const card = document.createElement("article");
      card.className = "store-card";
      card.tabIndex = 0;
      card.innerHTML = `<h2>${s.nombre}</h2><p>${s.ciudad}, ${s.pais}</p>${badge}`;
      const focus = () => {
        document.querySelectorAll(".store-card").forEach((c) => c.classList.remove("is-active"));
        card.classList.add("is-active");
        map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 14), { duration: 1 });
        m.openPopup();
      };
      card.addEventListener("click", focus);
      card.addEventListener("keydown", (e) => { if (e.key === "Enter") focus(); });
      cardsEl.appendChild(card);
    });

    if (LOCALES.length === 1) map.flyTo([LOCALES[0].lat, LOCALES[0].lon], 13, { duration: 1.5 });
  </script>
  <script src="app.js" defer></script>
</body>
</html>
